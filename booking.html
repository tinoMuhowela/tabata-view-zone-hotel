<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book | Tabata View Zone Hotel</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="navbar">
    <a href="index.html" class="logo">Tabata View Zone</a>

    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="index.html#rooms">Rooms</a>
      <a href="index.html#events">Events</a>
      <a href="index.html#contact">Contact</a>
    </nav>
  </header>

  <main class="booking-page">
    <h1>Make a Reservation</h1>
    <p>Choose what you would like to book.</p>

    <div class="book-tabs">
      <button type="button" class="tab active" data-tab="stay">Stay</button>
      <button type="button" class="tab" data-tab="event">Hall / Event</button>
    </div>

    <form class="book-form" id="stay-form">
      <label>Check-in
        <input type="date" id="check-in">
      </label>
      <label>Check-out
        <input type="date" id="check-out">
      </label>
      <label>Guests
        <input type="number" id="guests" min="1" max="10" value="2">
      </label>
      <button type="submit" class="btn">Continue</button>
    </form>

    <form class="book-form hidden" id="event-form">
      <label>Event type
        <select id="event-type">
          <option value="conference">Conference</option>
          <option value="wedding">Wedding</option>
          <option value="meeting">Meeting</option>
          <option value="other">Other</option>
        </select>
      </label>
      <label>Date
        <input type="date" id="event-date">
      </label>
      <label>Guests
        <input type="number" id="event-guests" min="10" value="50">
      </label>
      <button type="submit" class="btn">Continue</button>
    </form>
  </main>

  <script src="js/booking.js"></script>
</body>
</html>
